<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Roboflow AI 분석</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header>
      <h1>🤖 AI 이미지 분석</h1>
      <p>Roboflow 학습 모델을 이용한 이미지 분석</p>
    </header>

    <section class="card">
      <h2>이미지 선택</h2>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <div class="preview">
        <img id="previewImage" alt="분석할 이미지">
        <canvas id="resultCanvas"></canvas>
      </div>

      <button id="predictButton" disabled>
        AI 분석 시작
      </button>

      <p id="status">이미지를 선택해 주세요.</p>
    </section>

    <section class="card">
      <h2>분석 결과</h2>
      <div id="results">
        분석 결과가 여기에 표시됩니다.
      </div>
    </section>

    <footer>
      Powered by Roboflow
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
